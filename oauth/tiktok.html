<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Retour vers Shorts Scheduler</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 40px auto;
        padding: 0 16px;
        line-height: 1.6;
        color: #1a1a1a;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #e8e8e8;
          background: #141414;
        }
        a {
          color: #8ab4ff;
        }
      }
    </style>
  </head>
  <body>
    <h1>Retour vers Shorts Scheduler…</h1>
    <p>
      Connexion TikTok terminée. Si rien ne se passe, <a id="lien" href="#">clique ici</a> (Shorts Scheduler
      doit être lancé sur ce PC).
    </p>
    <script>
      // Page relais : TikTok exige une adresse de retour en https. Cette page ne fait que renvoyer le navigateur
      // vers l'appli locale (127.0.0.1, uniquement sur ton PC) avec les mêmes paramètres. Elle n'envoie rien ailleurs.
      (function () {
        var cible = "http://127.0.0.1:3000/api/accounts/tiktok/callback" + window.location.search;
        document.getElementById("lien").href = cible;
        window.location.replace(cible);
      })();
    </script>
  </body>
</html>
